name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline suites and the local Pactum template. Playwright template tests
      # hit Restful Booker and are not run here.
      - run: npm run typecheck
      - run: npm run test:config
      - run: npm run test:importers
      - run: npm run test:safety
      - run: npm run test:auth
      - run: npm run test:redact
      - run: npm run test:cleanup
      - run: npm run test:gate
      - run: npm run test:gate:pactum
      - run: npm run test:eval
      - run: npm run test:claude-api
      - run: npm run test:settings
      - name: Pactum template tests
        env:
          LOCAL_API_AUTH_VALUE: Bearer hackathon-demo-token
        run: |
          mkdir -p reports/pactum
          node local-api/server.mjs &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/products >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "local API exited before it was ready"
              exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/products >/dev/null
          npm run test:template:pactum
      - run: npm audit --audit-level=high
