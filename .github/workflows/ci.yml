name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        # Git Bash on Windows; every step only calls node and npm, so the commands themselves are the
        # same on all three systems.
        shell: bash
    env:
      LOCAL_API_AUTH_VALUE: Bearer local-shop-demo-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline suites. The Playwright template tests hit Restful Booker and are not run here.
      - run: npm run typecheck
      - run: npm run test:platform
      - run: npm run test:config
      - run: npm run test:importers
      - run: npm run test:safety
      - run: npm run test:security
      - run: npm run test:exit
      - run: npm run test:auth
      - run: npm run test:http
      - run: npm run test:redact
      - run: npm run test:cleanup
      - run: npm run test:gate
      - run: npm run test:gate:pactum
      - run: npm run test:response-schema
      - run: npm run test:sheet-feedback
      - run: npm run test:eval
      - run: npm run test:claude-api
      - run: npm run test:settings
      - run: npm run test:ui
      - run: npm run test:ui-smoke
      # The page layout in headless Chromium at several widths and zoom levels (columns never overlap).
      # Retried: the runner's apt mirrors sometimes time out while installing Chromium's system packages.
      - name: Install Chromium (3 tries)
        shell: bash
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install failed (try $i), retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run test:ui-layout
      - run: npm run test:checkpoint
      - run: npm run test:test-cases
      - run: npm run test:atlassian
      - run: npm run test:ui-atlassian
      - name: Pactum template tests against the local API
        run: |
          mkdir -p reports/pactum
          node local-api/server.mjs &
          api_pid=$!
          node -e "
            const until = Date.now() + 30000;
            (async function wait() {
              try { await fetch('http://127.0.0.1:4000/products'); process.exit(0); }
              catch { if (Date.now() > until) { console.error('local API not ready'); process.exit(1); } setTimeout(wait, 500); }
            })();"
          status=0
          npm run test:template:pactum || status=$?
          kill "$api_pid" 2>/dev/null || true
          exit $status
      # The whole agent with FAKE_MODEL=1 (no model key) for both frameworks and for the sample test case
      # sheet, then npm install and npm test in each exported project, outside the repo.
      - name: End-to-end run, framework export, npm test in the export
        run: npm run test:e2e
      - name: npm audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --audit-level=high
      # The media demo (base URL with a path, images, paging, 400s, sheet-only coverage) with FAKE_MODEL=1
      # for both frameworks, then npm test in each exported project.
      - name: Media demo end-to-end (base path, images, paging, coverage)
        run: npm run test:e2e-media

  # Windows from the kind of folder people actually unpack into: a path with spaces, on a drive letter
  # other than C: (J: is mapped with subst), and Node 24.21.0 as on the machine that first hit the crash.
  # npm run ui must start and load the agent modules through tsx, then the UI tests and the whole agent
  # (FAKE_MODEL=1) run from the same folder. A raw Windows path given to tsImport() or import() fails here
  # with ERR_UNSUPPORTED_ESM_URL_SCHEME ("Received protocol 'j:'").
  windows-paths:
    name: windows-latest / Node ${{ matrix.node }} / ${{ matrix.where }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        where: ['J:\Api test agent\api-test-agent', 'J:\apitestagent\api-test-agent', 'D:\a\Api test agent\api-test-agent']
        include:
          - node: 22
            where: 'J:\Api test agent\api-test-agent'
          - node: 24.21.0
            where: 'J:\Api test agent\api-test-agent'
    defaults:
      run:
        shell: pwsh
    env:
      LOCAL_API_AUTH_VALUE: Bearer local-shop-demo-token
      WHERE: ${{ matrix.where }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Copy the repo to ${{ matrix.where }}, then npm ci, UI smoke, UI tests and end-to-end run there
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WHERE.StartsWith('J:')) {
            $backing = Join-Path $env:RUNNER_TEMP 'jdrive'
            New-Item -ItemType Directory -Force -Path $backing | Out-Null
            subst J: $backing
            if ($LASTEXITCODE -ne 0) { throw 'subst J: failed' }
          }
          New-Item -ItemType Directory -Force -Path $env:WHERE | Out-Null
          robocopy $env:GITHUB_WORKSPACE $env:WHERE /E /XD .git node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          Set-Location -LiteralPath $env:WHERE
          Write-Host "Running from $((Get-Location).Path)"
          node -p "'node ' + process.version + ', cwd ' + process.cwd()"
          npm -v
          function Run([string]$script) {
            npm run $script
            if ($LASTEXITCODE -ne 0) { throw "npm run $script failed ($LASTEXITCODE)" }
          }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          Run 'test:ui-smoke'
          Run 'test:ui'
          Run 'test:test-cases'
          Run 'test:atlassian'
          Run 'test:ui-atlassian'
          Run 'test:e2e'
